[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trentmaziarz/slate"

[workspace.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_dock = "=0.21.1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libheif-rs = "3.0.0"
moxcms = "0.9"
rfd = "0.17"
half = "2"
